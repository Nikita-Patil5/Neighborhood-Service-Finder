name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servicefinder/servicefinder
    services:
      mysql:                                   # needed if you keep the default @SpringBootTest contextLoads test
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: neighborhood_service
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/neighborhood_service
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ci-only-secret-not-for-production-use-0123456789-abcdefghij
      APP_SALT: ci-only-salt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"                   # match <java.version> in pom.xml
          cache: maven
      # 1. Blocks test execution until the container is fully initialized
      - name: Wait for MySQL Database Initialization
        run: |
          sudo apt-get update && sudo apt-get install -y mysql-client
          for i in {1..20}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot --silent; then
              echo "MySQL container is running safely!"
              exit 0
            fi
            echo "Waiting for database initialization..."
            sleep 3
          done
          echo "MySQL container failed to start"
          exit 1

      # 2. Add executable rights to wrapper script and execute inside the directory
      - name: Run Backend Tests 
        run: |
          chmod +x mvnw
          ./mvnw -B test -Dspring.profiles.active=test

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # analytics tests only need pandas/numpy, so no heavy ML downloads in CI
      - run: pip install pandas numpy pytest
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servicefinder/neighborhood-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
