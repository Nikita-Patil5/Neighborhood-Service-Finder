name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servicefinder/servicefinder      # folder that contains pom.xml
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: neighborhood_service
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      # the URL needs these parameters, otherwise MySQL 8 rejects the connection
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/neighborhood_service?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      # required properties (no defaults in application.properties); test-only values
      # JwtUtil Base64-decodes this value, so it must be valid Base64 (no hyphens). Test-only value.
      JWT_SECRET: "Y2ktb25seS1zZWNyZXQtbm90LWZvci1wcm9kdWN0aW9uLXVzZS0wMTIzNDU2Nzg5LWFiY2RlZmdoaWo="
      APP_SALT: ci-only-salt
      APP_SEED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"            # MUST match <java.version> in pom.xml
          cache: maven
      - run: mvn -B test

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # analytics tests only need pandas/numpy, so no heavy ML downloads in CI
      - run: pip install pandas numpy pytest
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servicefinder/neighborhood-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build