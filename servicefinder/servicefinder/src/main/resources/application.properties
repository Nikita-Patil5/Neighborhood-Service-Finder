# ===== Application Info =====
spring.application.name=Neighborhood-Service-Finder
server.port=8080

# ===== Database =====
# Real credentials go in application-local.properties (git-ignored) or environment variables.
spring.datasource.url=jdbc:mysql://localhost:3306/neighborhood_service?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ===== JPA / Hibernate =====

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===== Mail (use a Gmail App Password) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== JWT (required: the app will not start without a secret) =====
jwt.secret=${JWT_SECRET}
# check the unit in your JWT code: 86400000 is 24 hours if it expects milliseconds
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== Custom salt (required) =====
spring.saltvalue=${APP_SALT}

# ===== AI microservice =====
ai.service.url=http://localhost:8000

# ===== Demo data (off by default; turn on in application-local.properties) =====
app.seed=false
