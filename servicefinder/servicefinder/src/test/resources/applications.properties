# Force a distinct profile for safety during test orchestration
spring.profiles.active=test

# Database configuration targeting the CI test containers loop
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/neighborhood_service
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration overrides for clean environment bootstrapping
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# 🔐 THE FIX: Secure fallback keys (>32 characters) to pass constraints validation safely
jwt.secret=secureSecretKeyForCI01234567890123456789012345678912345
jwt.expiration=3600000
app.salt=ci-secure-salt-value-for-hashing-verification
